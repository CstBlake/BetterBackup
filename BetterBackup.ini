; ============================================================
; BetterBackup Configuration
; ============================================================
;
; Key bindings use standard Windows key names.
;
; Examples:
; H
; E
; F7
; Space
; Return
; NumPad4
; NumPad5
; NumPad6
;
; Changes take effect the next time BetterBackup is loaded.
; ============================================================


[Keys]

; ------------------------------------------------------------
; Placement Confirm
; ------------------------------------------------------------
; Confirms the manually selected parking position.
;
; Default: H

PlacementConfirmKey=H


; ------------------------------------------------------------
; Force Teleport
; ------------------------------------------------------------
; During the final approach, immediately moves the responding
; unit to its requested parking position.
;
; This applies to both manually selected positions and
; Park Behind Cruiser positions.
;
; Default: H

ForceTeleportKey=H


; ------------------------------------------------------------
; Default Response / Cancel Placement
; ------------------------------------------------------------
; Cancels BetterBackup placement and allows Policing Redefined
; to handle the responding unit normally.
;
; Default: E

PlacementCancelKey=E


; ------------------------------------------------------------
; Rotate Left
; ------------------------------------------------------------
; Rotates the manually selected parking direction left.
;
; Default: NumPad4

RotateLeftKey=NumPad4


; ------------------------------------------------------------
; Park Behind Cruiser
; ------------------------------------------------------------
; Parks the responding unit behind the player's remembered
; police/emergency vehicle.
;
; BetterBackup calculates the position using the actual
; dimensions of the player's police vehicle and the responding
; vehicle.
;
; The position and heading are fixed at the moment this key is
; pressed. If the player's police vehicle subsequently moves,
; the requested backup position DOES NOT move with it.
;
; Default: NumPad5

ParkBehindCruiserKey=NumPad5


; ------------------------------------------------------------
; Rotate Right
; ------------------------------------------------------------
; Rotates the manually selected parking direction right.
;
; Default: NumPad6

RotateRightKey=NumPad6